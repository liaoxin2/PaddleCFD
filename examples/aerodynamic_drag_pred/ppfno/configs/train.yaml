hydra:
  run:
    # dynamic output directory according to running time and override name
    dir: hydraLog/${now:%Y-%m-%d-%H-%M-%S}-${mode}
  job:
    name: ${mode} # name of logfile
    chdir: false # keep current working direcotry unchaned
  sweep:
    # output directory for multirun
    dir: ${hydra.run.dir}
    subdir: ./

# model
model: "GNOFNOGNO_all"
radius_in: 0.04  # 0.04
radius_out: 0.04  # 0.04
embed_dim: 32  # 32
hidden_channels: [64, 64] # [64, 64]
in_channels: 4
out_channels: [1,3] # pressure + wss
fno_modes: [32, 32, 32] # [32, 32, 32]
fno_hidden_channels: 64 # 64
fno_out_channels: 64 # 64
weighted_kernel: false
max_in_points: 500000  # 500000
subsample_train: 8 # 1
subsample_eval: 1 # only set to 1 can get right Cd truth
out_keys: ["pressure","wallshearstress"]
sdf_spatial_resolution: [64, 64, 64] # or [64, 64, 64]

# data
data_module: "SAE"
n_train_num: 100000000 # 862
n_val_num: 100000000 # 1
n_test_num: 100000000 # 166
lazy_loading: true  # load all data into memory or not

# settings
enable_ddp: true
devices: [1, 2]  # python -m paddle.distributed.launch --gpus=6 train.py
seed: 0
lr: 0.0003 # 0.0005
weight_list: [5.0, 1.0] # [20.0, 1.0]
batch_size: 1
num_epochs: 100 # 1000
finetuning_epochs: 150
mode: "train"  # train, test
state: null # '/xxx/GNOFNOGNO_all.pdparams'
save_per_epoch: 200
save_eval_results: false
resume_ep: -1
reference_point: [-3.20625,0,0]
optimizer: "SOAP" # AdamW or SOAP

# Finetuning
lr_cd: 0.001
layers: [2,64,128,64,1]
weight_F_M: [20,1,1,1,1,1]
# 各物理量全局特征尺度(物理空间 RMS)，用于 hybrid_loss 软下限 & 符号惩罚归一化。
# 运行时由 train.py 首次遍历训练集自动计算并缓存到 force_moment_scale.json，
# 之后自动读取；此处的值仅作为计算失败时的回退默认(fallback)。
# scale_F 顺序: [drag, lift, lateral]; scale_M 顺序: [overturning, pitching, roll]
scale_F: [86.94, 738.31, 617.42]
scale_M: [152.09, 196.60, 276.78]
eps_rel: 0.05           # 软下限系数: floor = eps_rel*scale (点头 197 -> 下限≈10)
sign_penalty_w: 0.3     # 力矩符号翻转惩罚权重 (0 关闭)
delta_reg_lambda: 0.01  # 残差修正量 Δ 的 L2 正则权重 (0 关闭)

# 方案 A: Phase-1 可微分区积分力/力矩损失权重 (0 关闭)。>0 时在场回归阶段追加积分
#   F/M 损失, 梯度直达 backbone, 用 weight_F_M(含点头权重)重塑场预测以改善积分量误差。
phase1_fm_loss_w: 1.0
# 方案 D: 逐车厢特征尺度自适应软下限 (true 开启)。首次训练自动统计各车厢 F/M 的 RMS
#   并缓存到 force_moment_scale.json; 小真值中间车厢点头不再被整车全局 floor 淹没。
region_scale: true
# 方案 B: 力臂加权场损失 (0 关闭)。Phase-1 的 pressure 场损失按
#   w = 1 + alpha*|x - x_ref(车厢)|/(L_车厢/2) 加权(权重已归一化, 不改变整体标定),
#   加重车厢端部(长力臂)点的压力误差惩罚, 针对性改善俯仰力矩。alpha=2 时端部点
#   权重约为中心点 3 倍。仅影响 Phase-1 且需 phase1_fm_loss_w>0(依赖其 lever_dist)。
lever_weight_alpha: 2.0

# inference & train DataPreprocess
process_mode: train # train, infer
pre_input_path: null 
pre_output_path: null 
bounds_dir: null # only for infer

task_id: 1

model_name: ${model}

# train params
train_ratio: 0.8
test_ratio: 0.2
train_input_path: null
train_output_path: null
train_ids_path: null   # 训练索引文件完整路径
test_ids_path: null    # 测试索引文件完整路径
split_json_path: /workspace/workspace/PaddleCFD/examples/aerodynamic_drag_pred/ppfno/train_output/train_001/json/radius.json  # 直接复用预训练保存的 radius.json 划分(优先级最高), 保证微调与预训练train/test一致

refine_input_path: null
refine_output_path: null
