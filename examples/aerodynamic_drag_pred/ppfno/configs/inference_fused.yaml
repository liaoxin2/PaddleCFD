hydra:
  run:
    # dynamic output directory according to running time and override name
    dir: hydraLog/${now:%Y-%m-%d-%H-%M-%S}-${mode}
  job:
    name: ${mode} # name of logfile
    chdir: false # keep current working direcotry unchaned
  sweep:
    # output directory for multirun
    dir: ${hydra.run.dir}
    subdir: ./

# model
model: "GNOFNOGNO_all"
radius_in: 0.035  # 0.045
radius_out: 0.035  # 0.045
embed_dim: 32  # 32
hidden_channels: [64, 64] # [64, 64]
in_channels: 4
out_channels: [1,3] # pressure + wss
fno_modes: [32, 32, 32] # [32, 32, 32]
fno_hidden_channels: 64 # 64
fno_out_channels: 64 # 64
weighted_kernel: false
max_in_points: 500000  # 500000
subsample_train: 8 # 1
subsample_eval: 1 # only set to 1 can get right Cd truth
out_keys: ["pressure","wallshearstress"]
sdf_spatial_resolution: [64, 64, 64] # or [64, 64, 64]

# data
data_module: SAE
n_inference_num: 1
lazy_loading: true

# settings
# NOTE: enable_ddp is ignored by the fused pipeline; inference always runs single-process.
enable_ddp: false
seed: 0
batch_size: 1
mode: "inference_fused"
save_eval_results: true
subsample_eval_out: 1
reference_point: [-3.20625,0,0]

# Finetuning (kept for network instantiation parity with train/inference)
lr_cd: 0.01
layers: [2,64,128,64,1]
weight_F_M: [20,1,1,1,1,1]
scale_F: [86.94, 738.31, 617.42]
scale_M: [152.09, 196.60, 276.78]
eps_rel: 0.05
sign_penalty_w: 0.3
delta_reg_lambda: 0.01

# fused inference params
state: null                 # path to checkpoint .pdparams (required)
pre_input_path: null        # root dir; each sub-dir is a case containing {caseid}.stl + {caseid}.json
reason_output_path: null    # output root; one sub-dir per case
bounds_dir: null            # dir with global_bounds.txt / area_bounds.txt / train_{key}_coef_mean_std.txt
preprocess_workers: 1       # >1 enables parallel preprocessing via a spawn ProcessPool
